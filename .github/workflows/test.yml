name: Live site checks

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 13 * * *'   # every day, 6 AM Arizona time: catches problems on the live site early
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to run, e.g. @smoke or @known-bug'
        default: '(@smoke or @regression) and not @known-bug'

jobs:
  ui-tests:
    name: UI tests (headless Chrome)
    runs-on: ubuntu-latest
    env:
      TAGS: ${{ inputs.tags || '(@smoke or @regression) and not @known-bug' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Cucumber scenarios
        run: mvn -B test -Dtest=RunCucumberTest -Dheadless=true -Dcucumber.filter.tags="$TAGS"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
